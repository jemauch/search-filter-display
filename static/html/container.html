      <section id="ui-section" data-page="1" data-filter="none" style="width: 100%">
      <div id="toolbar">

      <div id="filter-wrapper" style="width: auto">
      <div id="dropdown-layout" style="display: flex; flex-direction: row; flex-grow: 1; width: 100%; gap: 5px;">

        <div class="filter-card-wrapper" id="filterWrapper">
          <div class="filter-trigger" id="filterTrigger">
            <button id="filter-button" class="simpui-btn secondary" aria-expanded="false" aria-controls="filterCard" style="padding: 2px; margin: 0px;">
              <img decoding="async" style="filter: invert(100%); margin: 0px"
              src="[filter]" alt="">
              Filters
            </button>
          </div>

          <form id="filter-form">
            <div class="filter-card filter-popup" id="filterCard">
              <div class="filter-card-top">
                <h2>Filters</h2>
                <button id="filterClose" class="filter-close" type="button" aria-label="Close filters">
                  <img decoding="async" src="[close]">
                </button>
              </div>

              <div id="inv-main-type" class="filter-popup-item">
                <button type="button" class="filter-accordion" aria-expanded="false" aria-controls="type-filter-panel">Item Type</button>
                <div id="type-filter-panel" class="panel"></div>
                <button type="button" class="filter-accordion" aria-expanded="false" aria-controls="origin-filter-panel">Subject</button>
                <div id="origin-filter-panel" class="panel"></div>
                <button type="button" class="filter-accordion" aria-expanded="false" aria-controls="media-filter-panel">Media</button>
                <div id="media-filter-panel" class="panel"></div>

                <fieldset>
                  <legend>Year</legend>
                  <select name="year" id="year">
                    <option value="">--View All--</option>
                    [years]
                  </select>
                </fieldset>
                
                <fieldset>
                  <legend>Quantity</legend>
                  <div>
                    <input type="checkbox" name="missing-items" id="missing-items">
                    <label for="missing-items">Show missing and needed items only</label>
                  </div>
                </fieldset>

                <fieldset>
                  <legend>Conference</legend>
                  <div>
                    <input type="radio" name="conference" id="siggraph" value="siggraph">
                    <label for="siggraph">SIGGRAPH</label>
                  </div>

                  <div>
                    <input type="radio" name="conference" id="siggraph-asia" value="siggraph-asia">
                    <label for="siggraph-asia">SIGGRAPH Asia</label>
                  </div>

                  <div>
                    <input type="radio" name="conference" id="both-conferences" value="both" checked>
                    <label for="both-conferences">Both Conferences</label>
                  </div>
                </fieldset>

                <div style="display: flex; flex-wrap: wrap; justify-content: end;">
                  <div id="filterReset">
                    <button type="button" id="filter-reset" class="simpui-btn danger sm">Reset</button>
                  </div>
                  <div id="filterApply">
                    <button type="button" id="filter-apply" class="simpui-btn dark sm">Apply</button>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
        
        <!-- <div class="simpui-form-group" style="margin-left: 4px; width: 300px; height: 30px;">[search]</div> -->

        <div id="spacing" style="flex: grow;"></div>

        <div id="results-per-page" style="margin-left: auto; margin-right: 0px;">[result_per_page]</div>
        <div id="display" style="width: auto; margin-left: 6px; margin-right: 0px;">[display_buttons]</div>
      </div>
